type User {
  id: ID!
  name: String!
  email: String!
  role: UserRole!
  createdAt: String!
  posts: [Post!]!
}

type Post {
  id: ID!
  title: String!
  content: String!
  createdAt: String!
  updatedAt: String!
  author: User!
}

type AuthPayload {
  token: String!
  user: User!
}

type PostPayload {
  post: Post
  success: Boolean!
  message: String
}

type DeletePayload {
  success: Boolean!
  message: String!
}

enum UserRole {
  ADMIN
  USER
}

type Query {
  # Get all posts
  posts: [Post!]!
  
  # Get a single post by ID
  post(id: ID!): Post
  
  # Get current user
  me: User
}

type Mutation {
  # Create a new post
  createPost(title: String!, content: String!): PostPayload!
  
  # Update an existing post
  updatePost(id: ID!, title: String, content: String): PostPayload!
  
  # Delete a post
  deletePost(id: ID!): DeletePayload!
}
